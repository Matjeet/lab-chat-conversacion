spring:
  application:
    name: chat-conversacion

  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
        one-indexed-parameters: false

  # Conexion a MongoDB: en Spring Boot 4.1 esto vive bajo spring.mongodb (modulo
  # spring-boot-mongodb), no bajo spring.data.mongodb (que ahora es solo opciones de
  # Spring Data: auto-index-creation, field-naming-strategy, etc., sin uri/database).
  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27017/chat_conversacion}

  # RabbitMQ: notificaciones de eventos (p. ej. solicitudes de chat nuevas), ver
  # com.arquetipo.demo.common.config.RabbitMqConfig / conversacion.service.NotificadorAmqp.
  # La conexion la autoconfigura spring-boot-starter-amqp a partir de estas propiedades y es
  # perezosa: el arranque de la app no depende de que RabbitMQ ya este levantado.
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

# Direccion gRPC de chat-registro: chat-conversacion es cliente de su rpc ExisteUsername (ver
# com.arquetipo.demo.registro.grpc.RegistroGrpcClient), para validar solicitante/solicitado
# antes de crear una solicitud de chat. Mismo nombre de propiedad que usa chat-gateway para lo
# mismo.
servicios:
  registro:
    grpc-host: ${REGISTRO_GRPC_HOST:localhost}
    grpc-port: ${REGISTRO_GRPC_PORT:9090}

grpc:
  server:
    # Servidor gRPC embebido (com.arquetipo.demo.common.grpc) — tercer protocolo del chat,
    # junto al WebSocket y al REST. false desactiva por completo su arranque (los tests lo
    # hacen, ver src/test/resources).
    enabled: ${GRPC_SERVER_ENABLED:true}
    # Puerto TCP propio, independiente de server.port (HTTP). 9091: el siguiente libre tras el
    # 9090 de chat-registro (ver PUERTOS.md).
    port: ${GRPC_SERVER_PORT:9091}

server:
  port: 8082
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

app:
  cors:
    # Origenes permitidos para /api/**. Lista separada por comas, cada uno con esquema +
    # host + puerto y SIN barra final (mismo criterio que CORS_ALLOWED_ORIGINS en chat-registro).
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
    allow-credentials: ${CORS_ALLOW_CREDENTIALS:false}
  amqp:
    # Exchange (topic) donde se publican las notificaciones (ver RabbitMqConfig /
    # NotificadorAmqp). La routing key distingue el tipo (hoy solo "notificacion.solicitud").
    notificaciones-exchange: ${RABBITMQ_NOTIFICACIONES_EXCHANGE:chat.notificaciones}
    # Altas de usuario que publica chat-registro (perfil.amqp.PerfilListener): exchange (topic)
    # que declara chat-registro y del que este servicio solo consume; la cola (durable) y el
    # binding SI los declara y los posee este servicio. Routing key tal cual la publica
    # chat-registro (registro.#).
    perfil-exchange: ${RABBITMQ_PERFIL_EXCHANGE:chat.conversacion}
    perfil-queue: ${RABBITMQ_PERFIL_QUEUE:chat-conversacion.perfil}
    perfil-routing-key: ${RABBITMQ_PERFIL_ROUTING_KEY:registro.#}

logging:
  level:
    com.arquetipo.demo: DEBUG
