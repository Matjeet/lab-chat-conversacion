plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'com.google.protobuf' version '0.9.6'
}

group = 'com.arquetipo'
version = '0.0.1-SNAPSHOT'
description = 'Chat en tiempo real por WebSockets entre dos usuarios, con mensajes de texto persistidos en MongoDB'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

ext {
	springdocVersion = '3.1.1'
	grpcVersion = '1.83.1'
	protobufVersion = '4.28.2'
}

dependencies {
	// --- Web / MVC ---
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-validation'

	// --- WebSockets (chat en tiempo real) ---
	implementation 'org.springframework.boot:spring-boot-starter-websocket'

	// --- Persistencia (mensajes en MongoDB) ---
	implementation 'org.springframework.boot:spring-boot-starter-data-mongodb'

	// --- Observabilidad ---
	implementation 'org.springframework.boot:spring-boot-starter-actuator'

	// --- Documentacion de API (OpenAPI / Swagger UI) ---
	implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:${springdocVersion}"

	// --- gRPC (tercer protocolo de transporte para el mismo chat: envio/reenvio de mensajes
	// en tiempo real e historial, junto al WebSocket y al REST) ---
	// El servidor se levanta a mano (com.arquetipo.demo.common.grpc), sin starter de terceros,
	// mismo patron que chat-registro.
	implementation "io.grpc:grpc-netty-shaded:${grpcVersion}"
	implementation "io.grpc:grpc-protobuf:${grpcVersion}"
	implementation "io.grpc:grpc-stub:${grpcVersion}"
	implementation "io.grpc:grpc-services:${grpcVersion}"  // habilita el servicio de reflexion (grpcurl sin .proto)
	implementation "com.google.protobuf:protobuf-java:${protobufVersion}"
	compileOnly 'jakarta.annotation:jakarta.annotation-api'  // @Generated en los stubs generados

	// --- Utilidades de desarrollo ---
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'

	// --- Test ---
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testCompileOnly 'org.projectlombok:lombok'
	testAnnotationProcessor 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	// grpc-testing depende de grpc-inprocess como dependencia opcional de Maven: Gradle no la
	// resuelve transitivamente a menos que se declare aparte (a diferencia de chat-registro,
	// donde llega igual porque la trae ademas firebase-admin).
	testImplementation "io.grpc:grpc-testing:${grpcVersion}"  // InProcessServerBuilder para probar el servicio gRPC sin red real
	testImplementation "io.grpc:grpc-inprocess:${grpcVersion}"
}

tasks.named('test') {
	useJUnitPlatform()
}

// Genera los stubs de gRPC/protobuf a partir de src/main/proto/*.proto (build/generated/source/proto).
protobuf {
	protoc {
		artifact = "com.google.protobuf:protoc:${protobufVersion}"
	}
	plugins {
		grpc {
			artifact = "io.grpc:protoc-gen-grpc-java:${grpcVersion}"
		}
	}
	generateProtoTasks {
		all().configureEach {
			plugins {
				grpc {}
			}
		}
	}
}

// Solo se publica el jar ejecutable de Spring Boot (evita el "-plain.jar").
tasks.named('jar') {
	enabled = false
}
